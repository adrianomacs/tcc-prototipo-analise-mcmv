# Lista de referências do trabalho, fonte única para a página "Referências"
# do aplicativo (app/paginas/pesquisa/referencias.py). Formato USP/ESALQ,
# que difere da ABNT: autores como "Sobrenome, I.I."
# separados por ";" e todos listados; ano logo após os autores; periódico
# como "Título. Periódico vol(num): páginas."; autor institucional por
# extenso com a sigla entre colchetes; sem negrito; ordem alfabética (a
# ordem deste arquivo não importa, o serviço ordena).
#
# Campos: chave (identificador estável), texto (a referência pronta),
# validar (true quando algum dado ainda precisa ser conferido na fonte, ou
# quando a obra ainda não é citada), nota (o que conferir) e citada
# (false para a obra registrada aqui que não é citada; a página
# a deixa de fora; omitido vale true).

